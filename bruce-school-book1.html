];
const unitMap={unit1,unit2,unit3,unit4,unit5,unit6};
const unitNames={unit1:"Unit 1",unit2:"Unit 2",unit3:"Unit 3",unit4:"Unit 4",unit5:"Unit 5",unit6:"Unit 6"};
const allWords=[]; Object.entries(unitMap).forEach(([k,arr])=>arr.forEach(x=>allWords.push([x[0],x[1],k])));
let words=allWords.slice(), idx=0, current="all";
const $=id=>document.getElementById(id);
const bruceExamples={
"handsome":"He is a handsome boy.","new":"I have a new bag.","classmate":"Amy is my classmate.","young":"My uncle is still young.","woman":"That woman is my teacher.","very":"She is very kind.","beautiful":"The flower is beautiful.","too":"I like music, too.","Nice to meet you.":"Nice to meet you, Tom.","cousin":"My cousin lives in Taipei.","really":"I really like this book.","year(s) old":"He is twelve years old.","I see.":"I see. Thank you.","singer":"She is a good singer.","office worker":"My dad is an office worker.","housewife":"She is a housewife.","police officer":"The police officer helps us.","writer":"He is a writer.","uncle":"My uncle is very tall.","aunt":"My aunt is a teacher.","wife":"His wife is kind.","daughter":"Their daughter is ten.","husband":"Her husband is a doctor.","son":"Their son is a student.","dear":"Dear Mom, I love you.","family":"My family is very happy.","elementary school":"My brother goes to elementary school.","junior high school":"Ryan goes to junior high school.","baby":"The baby is sleeping.",
"house":"This is my house.","parents":"My parents are at home.","living room":"We watch TV in the living room.","wall":"The picture is on the wall.","purple":"My bag is purple.","favorite":"Blue is my favorite color.","color":"What color is your bag?","kitchen":"Mom is in the kitchen.","dining room":"We eat in the dining room.","but":"I am tired, but I am happy.","gray":"The cat is gray.","brown":"The dog is brown.","cookie":"I want a cookie.","mice":"The mice are under the table.","maybe":"Maybe it will rain today.","sofa":"The cat is on the sofa.","hungry":"I am hungry now.","notebook":"This is my notebook.","marker":"I write with a marker.","brush":"She has a brush.","gift":"This gift is for you.","pencil case":"My pencil case is blue.","bathroom":"The bathroom is clean.","table":"The book is on the table.","bedroom":"My bedroom is small.","near":"My school is near my home.","between":"The ball is between the boxes.","behind":"The cat is behind the door.","in front of":"The bus is in front of the school.","special":"Today is a special day.","inside":"The key is inside the box.","right":"You are right.","each other":"We help each other.","above":"The clock is above the door.","enough":"We have enough food.","person":"She is a kind person.",
"guy":"That guy is my brother.","magic":"The magician does magic.","with":"I go to school with my friend.","can":"I can swim.","many":"There are many books here.","place":"This is a nice place.","use":"I use a computer every day.","sure":"I am sure about the answer.","let's...":"Let's go to the park.","careful":"Please be careful.","museum":"We visit the museum.","Hurry!":"Hurry! The bus is coming.","please":"Please sit down.","wait":"Please wait for me.","man":"That man is my teacher.","now":"I am busy now.","or":"Do you want tea or juice?","time":"What time is it?","wake up":"I wake up at seven.","class":"Our class starts at eight.","Oh my!":"Oh my! That is big.","see":"I can see a bird.","quiet":"Please be quiet.","turn off":"Please turn off the light.","sign":"I can see the sign.","talk":"We talk after class.","fight":"Do not fight at school.","turn":"It is my turn.","follow":"Please follow me.","rule":"Please follow the rule.","safe":"This place is safe.","wash":"Wash your hands, please.","hand":"Raise your hand.","after class":"We play after class.","mummy":"The mummy is in the museum.","rock":"There is a rock on the ground.","dinosaur":"The dinosaur is very big.","lab":"We are in the science lab.",
"music video":"We watch a music video.","band":"The band is popular.","take a look":"Please take a look at this.","all":"All the students are here.","cute":"The puppy is cute.","great":"You did a great job.","free":"I am free this afternoon.","weekend":"We go hiking on the weekend.","Saturday":"We play basketball on Saturday.","together":"We study together.","ready":"I am ready now.","p.m.":"The class starts at 2 p.m.","o'clock":"It is seven o'clock.","day":"Today is a sunny day.","today":"I am happy today.","Friday":"We have English on Friday.","Sunday":"We visit Grandma on Sunday.","Monday":"School starts on Monday.","Tuesday":"We have PE on Tuesday.","Wednesday":"I have music class on Wednesday.","Thursday":"We go swimming on Thursday.","week":"I study English every week.","a.m.":"I wake up at 7 a.m.","study":"I study English every day.","English":"English is fun.","take a walk":"We take a walk after dinner.","movie":"We watch a movie tonight.","take a picture":"Please take a picture of us.","party":"We have a birthday party.","report":"I read the report.","popular":"This song is popular.","fan":"I am a baseball fan.","shake hands":"They shake hands.","everyone":"Everyone is ready.","K-pop":"She likes K-pop.","concert":"We go to a concert.","meet-and-greet":"The meet-and-greet starts at six.","stage":"The singer is on the stage.",

function makeBruceExample(word){return bruceExamples[word] || `We learned the word ${word} today.`;}
function render(){const x=words[idx];$("word").textContent=x[0];$("zh").textContent=x[1];$("example").textContent=makeBruceExample(x[0]);$("progress").textContent=`${idx+1} / ${words.length}`;$("unitLabel").textContent=current==="all"?unitNames[x[2]]:unitNames[current];$("result").textContent="按「我來念」後，念出畫面上的英文。";}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let englishVoice = null;
function refreshEnglishVoice(){
  if(!("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices();
  englishVoice = voices.find(v => /^en-US$/i.test(v.lang) && /Samantha|Ava|Allison|Susan|Tom/i.test(v.name))
              || voices.find(v => /^en-US$/i.test(v.lang))
              || voices.find(v => /^en/i.test(v.lang))
              || null;
}
if("speechSynthesis" in window){
  refreshEnglishVoice();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", refreshEnglishVoice);
}
function speak(text, rate=0.82){
  if(!("speechSynthesis" in window)){
    $("result").textContent="這個瀏覽器不支援語音播放。";
    return;
  }
  const requestedRate = rate;
  const play = () => {
    refreshEnglishVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    if(englishVoice) u.voice = englishVoice;
    u.rate = isIOS ? (requestedRate <= 0.6 ? 0.65 : 0.88) : requestedRate;
    u.pitch = 1.0;
    u.volume = 1.0;
    u.onerror = () => { $("result").textContent="語音播放失敗，請再按一次。"; };
    speechSynthesis.speak(u);
    if(speechSynthesis.paused) speechSynthesis.resume();
  };
  speechSynthesis.cancel();
  setTimeout(play, isIOS ? 160 : 30);
}
function nextWord(){idx=(idx+1)%words.length;render()}function prevWord(){idx=(idx-1+words.length)%words.length;render()}function shuffleWord(){idx=Math.floor(Math.random()*words.length);render()}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,"").replace(/\s+/g," ").trim()}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("result").innerHTML="⚠️ 目前這個瀏覽器沒有提供網頁語音辨識。<br>仍可使用「聽單字」。";return}const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=5;$("result").textContent="🎧 正在聽，請念出單字……";r.onresult=e=>{const target=norm(words[idx][0]);const alts=[...e.results[0]].map(a=>norm(a.transcript));const heard=e.results[0][0].transcript;const exact=alts.some(a=>a===target);const close=alts.some(a=>a.includes(target)||target.includes(a));if(exact)$("result").innerHTML=`🌟 很棒！辨識到：<b>${heard}</b>`;else if(close)$("result").innerHTML=`👍 很接近！辨識到：<b>${heard}</b><br>再念一次看看。`;else $("result").innerHTML=`🔄 辨識到：<b>${heard}</b><br>目標：<b>${words[idx][0]}</b>`};r.onerror=()=>$("result").textContent="目前無法辨識語音，請再試一次。";try{r.start()}catch(e){$("result").textContent="請稍後再按一次「我來念」。"}}
function setCategory(v){current=v;words=v==="all"?allWords.slice():unitMap[v].map(x=>[x[0],x[1],v]);idx=0;render()}
$("speakWordBtn").addEventListener("click",()=>speak(words[idx][0],.82));$("slowWordBtn").addEventListener("click",()=>speak(words[idx][0],.55));$("speakExampleBtn").addEventListener("click",()=>speak(makeBruceExample(words[idx][0]),.82));$("slowExampleBtn").addEventListener("click",()=>speak(makeBruceExample(words[idx][0]),.55));$("repeatBtn").addEventListener("click",()=>speak(words[idx][0],.82));$("recBtn").addEventListener("click",startRecognition);$("prevBtn").addEventListener("click",prevWord);$("nextBtn").addEventListener("click",nextWord);$("shuffleBtn").addEventListener("click",shuffleWord);$("categorySelect").addEventListener("change",e=>setCategory(e.target.value));render();
