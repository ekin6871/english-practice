let words=[];let idx=0;const $=id=>document.getElementById(id);
function withUnit(arr,u){return arr.map(x=>[u,...x])}
function setUnit(v){if(v==='unit1')words=withUnit(unit1,1);else if(v==='unit2')words=withUnit(unit2,2);else if(v==='unit3')words=withUnit(unit3,3);else if(v==='unit4')words=withUnit(unit4,4);else if(v==='unit5')words=withUnit(unit5,5);else words=[...withUnit(unit1,1),...withUnit(unit2,2),...withUnit(unit3,3),...withUnit(unit4,4),...withUnit(unit5,5)];idx=0;render()}
function render(){const x=words[idx];$("progress").textContent=`${idx+1} / ${words.length}`;$("num").textContent=`Unit ${x[0]} · No. ${x[1]}`;$("word").textContent=x[2];$("zh").textContent=x[3];$("extra").textContent=x[4]||"";$("result").textContent="按「我來念」後，念出畫面上的英文。"}
function speak(text,rate=.82){if(!("speechSynthesis" in window)){ $("result").textContent="這個瀏覽器不支援語音播放。";return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;speechSynthesis.speak(u)}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,"").replace(/\s+/g," ").trim()}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("result").innerHTML="⚠️ 目前這個瀏覽器沒有提供網頁語音辨識。<br>仍可使用「聽單字」。";return}const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=5;$("result").textContent="🎧 正在聽，請念出單字……";r.onresult=e=>{const target=norm(words[idx][2]);const alts=[...e.results[0]].map(a=>norm(a.transcript));const heard=e.results[0][0].transcript;const exact=alts.some(a=>a===target);const close=alts.some(a=>a.includes(target)||target.includes(a));if(exact)$("result").innerHTML=`🌟 很棒！辨識到：<b>${heard}</b>`;else if(close)$("result").innerHTML=`👍 很接近！辨識到：<b>${heard}</b><br>再念一次看看。`;else $("result").innerHTML=`🔄 辨識到：<b>${heard}</b><br>目標：<b>${words[idx][2]}</b>`};r.onerror=()=>$("result").textContent="目前無法辨識語音，請再試一次。";try{r.start()}catch(e){$("result").textContent="請稍後再按一次「我來念」。"}}
$("unitSelect").onchange=e=>setUnit(e.target.value);$("speakWordBtn").onclick=()=>speak(words[idx][2],.82);$("slowWordBtn").onclick=()=>speak(words[idx][2],.55);$("repeatBtn").onclick=()=>speak(words[idx][2],.82);$("recBtn").onclick=startRecognition;$("prevBtn").onclick=()=>{idx=(idx-1+words.length)%words.length;render()};$("nextBtn").onclick=()=>{idx=(idx+1)%words.length;render()};$("shuffleBtn").onclick=()=>{idx=Math.floor(Math.random()*words.length);render()};setUnit('all');
</script></body></html>
