const round5Words = [["shot", "打針", "Visitors are getting shots."], ["vampire", "吸血鬼", "The story is about a vampire."], ["vaccination", "疫苗接種", "The castle has a vaccination program."], ["vaccine", "疫苗", "The vaccine helps protect people."], ["certificate", "證書；證明書", "He gets a special certificate."], ["bravery", "勇敢", "We thank her for her bravery."], ["free tour", "免費導覽", "They can take a free tour."], ["valley", "山谷", "The castle is in a beautiful valley."], ["mountain", "山脈；山", "There is a mountain near the town."], ["famous", "有名的", "He is a famous writer."], ["modern", "現代的", "This is a modern building."]];
let words = allWords.slice();
let idx = 0;

const $ = id => document.getElementById(id);
function render(){
  const x=words[idx];
  $("word").textContent=x[0];
  $("zh").textContent=x[1];
  $("example").textContent=x[2];
  $("progress").textContent=`${idx+1} / ${words.length}`;
  $("result").textContent="按「我來念」後，念出畫面上的英文。";
}
function speak(text, rate=0.82){
  if(!("speechSynthesis" in window)){ $("result").textContent="這個瀏覽器不支援語音播放。"; return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=rate;
  speechSynthesis.speak(u);
}
function nextWord(){idx=(idx+1)%words.length;render()}
function prevWord(){idx=(idx-1+words.length)%words.length;render()}
function shuffleWord(){idx=Math.floor(Math.random()*words.length);render()}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,"").replace(/\s+/g," ").trim()}
function startRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("result").innerHTML="⚠️ 目前這個 iPhone 瀏覽器沒有提供網頁語音辨識。<br>仍可使用「聽單字／聽例句」。";return}
  const r=new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=5;
  $("result").textContent="🎧 正在聽，請念出單字……";
  r.onresult=e=>{
    const target=norm(words[idx][0].split("(")[0]);
    const alts=[...e.results[0]].map(a=>norm(a.transcript));
    const heard=e.results[0][0].transcript;
    const exact=alts.some(a=>a===target);
    const close=alts.some(a=>a.includes(target)||target.includes(a));
    if(exact) $("result").innerHTML=`🌟 很棒！辨識到：<b>${heard}</b>`;
    else if(close) $("result").innerHTML=`👍 很接近！辨識到：<b>${heard}</b><br>再念一次看看。`;
    else $("result").innerHTML=`🔄 辨識到：<b>${heard}</b><br>目標：<b>${words[idx][0]}</b>`;
  };
  r.onerror=()=>$("result").textContent="目前無法辨識語音，請再試一次。";
  try{r.start()}catch(e){$("result").textContent="請稍後再按一次「我來念」。"}
}
function setCategory(v){
if(v==="all") words=allWords.slice();
else if(v.startsWith("week")){const w=parseInt(v.replace("week",""),10);words=allWords.slice((w-1)*24,(w-1)*24+24);}
else if(v==="round5") words=round5Words.slice();
idx=0;render();
}

$("speakWordBtn").addEventListener("click",()=>speak(words[idx][0],0.82));
$("slowWordBtn").addEventListener("click",()=>speak(words[idx][0],0.55));
$("speakExampleBtn").addEventListener("click",()=>speak(words[idx][2],0.82));
$("slowExampleBtn").addEventListener("click",()=>speak(words[idx][2],0.55));
$("repeatBtn").addEventListener("click",()=>speak(words[idx][0],0.82));
$("recBtn").addEventListener("click",startRecognition);
$("prevBtn").addEventListener("click",prevWord);
$("nextBtn").addEventListener("click",nextWord);
$("shuffleBtn").addEventListener("click",shuffleWord);
$("categorySelect").addEventListener("change",e=>setCategory(e.target.value));
render();
</script>
